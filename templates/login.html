<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reviewer login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <h1>Reviewer login</h1>
  <p class="lead">Enter the shared reviewer password.</p>

  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('admin_login') }}" autocomplete="off">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autofocus>
    <p class="button-row"><button type="submit">Sign in</button></p>
  </form>

  {% if reset_enabled %}
  <form method="post" action="{{ url_for('admin_request_reset') }}" class="reset-link-form">
    <button type="submit" class="link-button">Reset password (emails the HR reviewer)</button>
  </form>
  {% endif %}
</main>
</body>
</html>
