<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Access required</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <h1>Access required</h1>
  <p class="lead">This site is shared internally only. Enter the access code to continue.</p>

  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('unlock') }}" autocomplete="off">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <label for="password">Access code</label>
    <input id="password" name="password" type="password" required autofocus autocomplete="off">
    <p class="button-row"><button type="submit">Continue</button></p>
  </form>
</main>
</body>
</html>
